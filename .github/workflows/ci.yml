name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', 'stable']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false # zero third-party deps; nothing useful to cache yet

      - name: Vet root module
        run: go vet ./...

      - name: Test root module
        run: go test ./... -count=1 -race

      - name: Vet sbom module
        working-directory: sbom
        run: go vet ./...

      - name: Test sbom module
        working-directory: sbom
        run: go test ./... -count=1 -race
