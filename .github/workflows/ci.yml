name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', 'stable']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false # zero third-party deps; nothing useful to cache yet

      # go.work joins the root module and ./sbom. Nested modules are not
      # matched by the root "...", so list both patterns explicitly.
      - name: Vet
        run: go vet ./... ./sbom/...

      - name: Test
        run: go test ./... ./sbom/... -count=1 -race
